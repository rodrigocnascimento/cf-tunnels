name: Test cftunnel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Test shell CLI
        run: |
          for script in run.sh install.sh uninstall.sh lib/*.sh packages/tui/scripts/*.sh; do bash -n "$script"; done
          ./tests/run.sh
      - name: Test TUI and packaged-runtime build
        working-directory: packages/tui
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build
